<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldman Sachs AI Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F6F8; --surface-2:#ECEFF3; --line:#DDE2E8; --line-2:#C5CCD6;
  --ink:#161A20; --ink-2:#4D5664; --ink-3:#7B8492; --accent:#46679C; --brand:#7B98C4; --brand-ink:#0F1622;
  --allow:#1F7A4D; --redact:#9A6410; --block:#B3352C; --throttle:#6A54A8; --monitor:#33609E;
  --allow-bg:#E2F1E8; --redact-bg:#F6EBD6; --block-bg:#F7E0DD; --throttle-bg:#ECE7F7; --monitor-bg:#E1E9F5;
  --hl:#DCE6F5; --add:#E2F1E8; --del:#F7E0DD;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --cond:"IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C131E; --surface:#131C29; --surface-2:#1A2434; --line:#243043; --line-2:#334157;
  --ink:#EEF1F5; --ink-2:#A8B3C2; --ink-3:#738098; --accent:#9DB5DD; --brand:#7B98C4; --brand-ink:#0F1622;
  --allow:#6CC293; --redact:#DDAA58; --block:#EC7C70; --throttle:#B6A3E8; --monitor:#86ACE0;
  --allow-bg:#163327; --redact-bg:#352914; --block-bg:#3B1E1C; --throttle-bg:#2A2340; --monitor-bg:#1B2A44;
  --hl:#1F3150; --add:#163327; --del:#3B1E1C;
}}
:root[data-theme="dark"]{
  --bg:#0C131E; --surface:#131C29; --surface-2:#1A2434; --line:#243043; --line-2:#334157;
  --ink:#EEF1F5; --ink-2:#A8B3C2; --ink-3:#738098; --accent:#9DB5DD; --brand:#7B98C4; --brand-ink:#0F1622;
  --allow:#6CC293; --redact:#DDAA58; --block:#EC7C70; --throttle:#B6A3E8; --monitor:#86ACE0;
  --allow-bg:#163327; --redact-bg:#352914; --block-bg:#3B1E1C; --throttle-bg:#2A2340; --monitor-bg:#1B2A44;
  --hl:#1F3150; --add:#163327; --del:#3B1E1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:15;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:0 32px;height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;white-space:nowrap}
.brand .gs{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-.01em}
.brand .sep{width:1px;height:24px;background:rgba(15,22,34,.45)}
.brand .cp{font-size:15px;font-weight:600}
.hdr nav{display:flex;gap:4px}
.hdr nav a{color:inherit;text-decoration:none;padding:20px 10px;white-space:nowrap;font-size:16px;border-bottom:3px solid transparent}
.hdr nav a:hover{border-bottom-color:rgba(15,22,34,.35)}
.hdr nav a[aria-current="page"]{border-bottom-color:var(--brand-ink);font-weight:700}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.live-chip{display:flex;align-items:center;gap:8px;border:1px solid rgba(15,22,34,.55);padding:6px 12px;font-weight:600;font-size:14px;background:none;cursor:pointer;color:inherit}
.live-chip i{width:8px;height:8px;border-radius:50%;background:#1E6B45;display:block}
.icon-btn{background:none;border:1px solid rgba(15,22,34,.55);width:36px;height:34px;cursor:pointer;color:inherit;display:grid;place-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}

main{max-width:1480px;margin:0 auto;padding:34px 32px 80px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.page-title{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.05;margin:0;letter-spacing:-.015em}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.page-head p{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
h2,h3{font-family:var(--cond);font-weight:600;margin:0;letter-spacing:0}
h2{font-size:22px}
h3{font-size:17px}

/* buttons */
.btn{border:1px solid var(--line-2);background:transparent;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px;border-radius:0;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--block);border-color:var(--block)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600;font-size:14px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;background:currentColor;display:block}
.st.allow{color:var(--allow);background:var(--allow-bg)} .st.allow::before{border-radius:50%}
.st.redact{color:var(--redact);background:var(--redact-bg)} .st.redact::before{height:3px}
.st.block{color:var(--block);background:var(--block-bg)}
.st.throttle{color:var(--throttle);background:var(--throttle-bg)} .st.throttle::before{clip-path:polygon(0 0,100% 50%,0 100%)}
.st.monitor{color:var(--monitor);background:var(--monitor-bg)} .st.monitor::before{border-radius:50%;background:none;box-shadow:inset 0 0 0 2px currentColor}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.fp{border-color:var(--monitor);color:var(--monitor)}
.tag.warn{border-color:var(--redact);color:var(--redact)}
.tag.err{border-color:var(--block);color:var(--block)}
.tag.new{border-color:var(--allow);color:var(--allow)}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);margin-bottom:24px}
.sum{padding:16px 18px;border-left:1px solid var(--line);background:none;border-top:0;border-right:0;border-bottom:3px solid transparent;text-align:left;cursor:pointer}
.sum:first-child{border-left:0}
.sum:hover{background:var(--surface)}
.sum[aria-pressed="true"]{border-bottom-color:var(--ink)}
.sum .v{font-family:var(--cond);font-size:30px;font-weight:600;line-height:1.1;display:block}
.sum .l{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.sum .l i{width:8px;height:8px;display:block}
.sum.static{cursor:default}
.sum.static:hover{background:none}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters input[type=search],.filters select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line-2);padding:8px 11px;border-radius:0}
.filters input[type=search]{width:280px;max-width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:7px 12px;border:1px solid var(--line-2)}
.chk:has(input:checked){border-color:var(--monitor);color:var(--monitor);background:var(--monitor-bg)}
.chk input{accent-color:var(--monitor)}
.spacer{flex:1}
.live-note{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.live-note i{width:8px;height:8px;border-radius:50%;background:var(--allow);display:block}
.live-note.paused i{background:var(--ink-3)}

/* table */
.table-wrap{overflow-x:auto;border-top:1px solid var(--line-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--surface)}
tr.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{from{background:var(--hl)}to{background:transparent}}
td.msg{white-space:normal;min-width:260px;max-width:420px;color:var(--ink-2)}
td.msg span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--ink-3)}
.num{text-align:right}
.empty{padding:40px 12px;color:var(--ink-2);text-align:center}

/* detail */
.crumbs{font-size:14px;margin-bottom:18px;color:var(--ink-3)}
.crumbs a{color:var(--ink-2)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start}
.reason{font-family:var(--serif);font-size:30px;line-height:1.2;margin:12px 0 6px;font-weight:400;max-width:34ch}
.sec{margin-top:34px}
.sec>h2{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.convo{display:flex;flex-direction:column;gap:10px}
.msgb{border-left:3px solid var(--line-2);padding:8px 14px;background:var(--surface)}
.msgb .who{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.msgb.tool{font-family:var(--mono);font-size:13px;border-left-color:var(--ink-3)}
.msgb.current{border-left-color:var(--accent);background:var(--hl)}
.payload{font-family:var(--mono);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.payload mark{background:var(--block-bg);color:var(--block);border-bottom:2px solid var(--block);padding:0 2px}
.payload .red{background:var(--redact-bg);color:var(--redact);font-weight:500;padding:0 3px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare>div{border:1px solid var(--line);padding:14px 16px;background:var(--surface)}
.compare h3{font-size:14px;color:var(--ink-2);margin-bottom:8px;font-family:var(--sans);font-weight:600}
.nothing{color:var(--ink-3);font-size:14px}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;position:relative;font-size:14.5px}
.chain li::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--line)}
.chain li:first-child::before{top:50%}.chain li:last-child::before{bottom:50%}
.chain .node{width:26px;height:26px;border:2px solid var(--line-2);background:var(--bg);position:relative;z-index:1;display:grid;place-items:center;font-size:12px;font-weight:700}
.chain .pass .node{border-color:var(--allow);color:var(--allow)}
.chain .block .node{background:var(--block);border-color:var(--block);color:var(--bg)}
.chain .redact .node{background:var(--redact);border-color:var(--redact);color:var(--bg)}
.chain .throttle .node{background:var(--throttle);border-color:var(--throttle);color:var(--bg)}
.chain .monitor .node{background:var(--monitor);border-color:var(--monitor);color:var(--bg)}
.chain .exception .node{border-color:var(--monitor);color:var(--monitor)}
.chain .skipped,.chain .off{color:var(--ink-3)}
.chain .kind{font-size:12.5px;color:var(--ink-3);margin-left:8px}
.chain .res{font-size:13px;color:var(--ink-2);text-align:right}
.chain .ai-ms{color:var(--accent)}
.chain-total{display:flex;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:10px;margin-top:4px;font-weight:600;font-size:14px}
.side{position:sticky;top:96px;display:flex;flex-direction:column;gap:20px}
.box{border:1px solid var(--line);background:var(--surface);padding:18px}
.box h3{margin-bottom:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;font-weight:600;word-break:break-word}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{text-align:left}
.replay{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:4px}
.replay .col{border:1px solid var(--line);padding:10px;background:var(--bg)}
.replay .col small{display:block;color:var(--ink-3);font-size:12.5px;margin-bottom:6px}
.replay .arrow{color:var(--ink-3);font-size:18px}
.replay-note{font-size:13.5px;color:var(--ink-2);margin:12px 0 0}
.fpnote{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--monitor);padding:6px 10px;margin-top:10px}

/* builder */
.bbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vmeta{font-size:14px;color:var(--ink-2);display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.vmeta b{color:var(--ink)}
.dirty{color:var(--redact);font-weight:600}
.banner{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;border:1px solid var(--redact);background:var(--redact-bg);padding:12px 16px;margin-bottom:18px;font-size:14.5px}
.banner b{font-family:var(--cond);font-size:16px}
.builder{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;gap:28px;align-items:start}
.builder.yaml{grid-template-columns:minmax(0,1fr) 340px minmax(0,1.05fr)}
.lib h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans);margin:18px 0 6px}
.lib h3:first-child{margin-top:0}
.lib button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;padding:7px 8px;cursor:pointer;font-size:14px}
.lib button:hover{border-color:var(--line-2);background:var(--surface)}
.lib button span{margin-left:auto;color:var(--ink-3);font-size:18px;line-height:1}
.gly{width:22px;height:22px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink-2)}
.gly svg{width:13px;height:13px}
.pipe{display:flex;flex-direction:column;align-items:stretch}
.endpoint{align-self:center;border:1px dashed var(--line-2);padding:8px 18px;font-size:14px;color:var(--ink-2);background:var(--bg)}
.wire{width:2px;height:18px;background:var(--line-2);align-self:center}
.ncard{border:1px solid var(--line);background:var(--surface);padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;position:relative}
.ncard:hover{border-color:var(--line-2)}
.ncard.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ncard.off{opacity:.55}
.ncard.drag-over{box-shadow:0 -3px 0 var(--accent)}
.ncard .gly{grid-row:span 2}
.ncard .nm{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ncard .sub{font-size:13px;color:var(--ink-2);grid-column:2}
.ncard .mode{grid-row:span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ncard .hits{font-size:12.5px;color:var(--ink-3)}
.ncard .ext{grid-column:1/-1;font-size:13px;color:var(--redact);border-top:1px dashed var(--redact);padding-top:6px;margin-top:4px}
.ncard .errs{grid-column:1/-1;font-size:13px;color:var(--block)}
.ncard .tools{position:absolute;top:-1px;right:-1px;display:none;background:var(--bg);border:1px solid var(--line-2)}
.ncard:hover .tools,.ncard.sel .tools,.ncard:focus-within .tools{display:flex}
.ncard .tools button{background:none;border:0;border-left:1px solid var(--line);width:30px;height:28px;cursor:pointer;color:var(--ink-2)}
.ncard .tools button:first-child{border-left:0}
.ncard .tools button:hover{color:var(--ink);background:var(--surface-2)}
.mpill{font-size:12.5px;font-weight:700;padding:1px 8px;border:1px solid currentColor}
.mpill.block{color:var(--block)}.mpill.redact{color:var(--redact)}.mpill.throttle{color:var(--throttle)}.mpill.monitor{color:var(--monitor)}.mpill.off{color:var(--ink-3)}
.add-node{align-self:center;margin-top:2px}
.settings{border:1px solid var(--line);background:var(--surface);padding:18px;position:sticky;top:96px;max-height:calc(100vh - 120px);overflow-y:auto}
.settings .head{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.settings .head p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%}
.field textarea{font-family:var(--mono);font-size:13px;min-height:84px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line-2);flex-wrap:wrap}
.seg button{border:0;border-left:1px solid var(--line-2);background:none;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent)}
.range b{font-family:var(--cond);font-size:18px;min-width:44px;text-align:right}
.subrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.subrow input,.subrow select{background:var(--bg);border:1px solid var(--line-2);padding:6px 8px;min-width:0;width:100%}
.subrow .x{background:none;border:1px solid var(--line-2);width:32px;height:32px;cursor:pointer;color:var(--ink-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);padding:4px 10px;font-size:13.5px;cursor:pointer}
.checks input{accent-color:var(--accent)}
.divider{border:0;border-top:1px solid var(--line);margin:18px 0}
.yamlpane{position:sticky;top:96px}
.yaml-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.yaml-wrap{position:relative;height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line-2);background:var(--surface)}
.yaml-wrap pre,.yaml-wrap textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font:13px/1.6 var(--mono);white-space:pre;overflow:auto;tab-size:2;border:0}
.yaml-wrap pre{color:transparent;pointer-events:none}
.yaml-wrap pre div{min-height:1.6em}
.yaml-wrap pre div.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--accent)}
.yaml-wrap textarea{background:transparent;color:var(--ink);resize:none;outline:none;caret-color:var(--accent)}
.yaml-err{margin-top:8px;font-size:13.5px;color:var(--block);border-left:3px solid var(--block);padding:6px 10px}
.yaml-ok{margin-top:8px;font-size:13px;color:var(--ink-3)}

/* history */
.hist{display:grid;grid-template-columns:380px minmax(0,1fr);gap:36px;align-items:start}
.vlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.vlist button{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 10px;cursor:pointer}
.vlist button:hover{background:var(--surface)}
.vlist button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.vlist .vn{font-family:var(--cond);font-size:22px;font-weight:600;grid-row:span 3;min-width:48px}
.vlist .sm{font-weight:600;font-size:14.5px}
.vlist .by{font-size:13px;color:var(--ink-3)}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}

<script>
/* ===================== constants ===================== */
const AGENTS=['support-bot','research-agent','code-assistant','finance-copilot'];
const MODELS=['llama3.1:8b','qwen2.5:7b'];
const KIND_LABEL={rule:'Rule',ai:'AI check',access:'Access',stage:'Service rules',signature:'Signature feed',budget:'Budget'};
const MODE_LABEL={block:'Block',redact:'Redact',throttle:'Throttle',monitor:'Monitor',off:'Off',enforce:'Enforce',allow:'Allow'};

const DIR_LABEL={input:'Prompt',output:'Answer',tool_call:'Service call'};

const OPS={eq:'equals',neq:'does not equal',contains:'contains',not_contains:'does not contain',starts_with:'starts with',lte:'≤',gte:'≥'};

  access:'<svg viewBox="0 0 14 14"><circle cx="4.5" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M11 7v2.5" stroke="currentColor" stroke-width="1.5"/></svg>',

  budget:'<svg viewBox="0 0 14 14"><path d="M2 11a5 5 0 1 1 10 0" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 11l2.5-4" stroke="currentColor" stroke-width="1.5"/></svg>',

};
const NODE_TYPES={
  secrets_detection:{label:'Secrets detection',group:'Deterministic rules',kind:'rule',modes:['block','redact','monitor','off'],desc:'Finds API keys, tokens and private keys with patterns. Patterns cannot catch every secret.',defaults:{mode:'redact'}},
  pii_detection:{label:'Personal data detection',group:'Deterministic rules',kind:'rule',modes:['block','redact','monitor','off'],desc:'Finds emails, phone numbers, PESEL, IBAN and card numbers.',defaults:{mode:'redact',entities:['email','phone','pesel','iban']}},
  regex_pattern:{label:'Custom pattern',group:'Deterministic rules',kind:'rule',modes:['block','redact','monitor','off'],desc:'Your own regular expressions, one per line.',defaults:{mode:'block',patterns:['(?i)internal use only']}},
  allowed_models:{label:'Allowed models',group:'Access',kind:'access',modes:['block','monitor','off'],desc:'Prompts can only go to these models.',defaults:{mode:'block',models:['llama3.1:8b','qwen2.5:7b']}},
  denied_paths:{label:'Denied paths',group:'Access',kind:'access',modes:['block','monitor','off'],desc:'Service calls whose arguments contain these paths are stopped.',defaults:{mode:'block',deny_paths:['.aws/credentials','/etc/shadow','.env']}},
  service_access:{label:'Service access rules',group:'Access',kind:'stage',modes:['enforce','monitor','off'],desc:'Applies the rules from the Service rules tab to every service call.',defaults:{mode:'enforce'}},
  signature_feed:{label:'Known exploit signatures',group:'Signature feed',kind:'signature',modes:['block','monitor','off'],desc:'Pickle loaders, RCE payloads and poisoned model repos from an external feed.',defaults:{mode:'block',feed:'signatures.internal/ai-exploits',refresh_minutes:60}},
  rate_limit:{label:'Rate limit',group:'Budget',kind:'budget',modes:['throttle','block','monitor','off'],desc:'Slows down agents that send too many requests.',defaults:{mode:'throttle',max_per_minute:30,delay_ms:2000}},
  token_budget:{label:'Token budget',group:'Budget',kind:'budget',modes:['throttle','block','monitor','off'],desc:'Daily token limit per agent.',defaults:{mode:'throttle',daily_tokens:1000000}},
  loop_detector:{label:'Runaway loop detector',group:'Budget',kind:'budget',modes:['block','throttle','monitor','off'],desc:'Stops sessions that repeat the same call again and again.',defaults:{mode:'block',max_similar_per_minute:30}},
  semantic:{label:'AI classification',group:'AI checks',kind:'ai',modes:['enforce','monitor','off'],desc:'A local model answers with one label. Each label has its own reaction.',
    defaults:{mode:'enforce',classifier:'custom',applies_to:'input',model:'llama3.1:8b',instruction_version:1,instruction:'Classify the message. Answer with exactly one word: safe or unsafe.',labels:[{label:'safe',reaction:'allow'},{label:'unsafe',reaction:'block'}],on_unknown:'block',on_timeout:'block',timeout_ms:800}}
};
const CHECK_KEYS=['classifier','entities','patterns','models','deny_paths','feed','refresh_minutes','max_per_minute','delay_ms','daily_tokens','max_similar_per_minute','applies_to','model','instruction_version','instruction','labels','on_unknown','on_timeout','timeout_ms','exceptions'];

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const rnd=(a,b)=>a+Math.random()*(b-a);
const t2=d=>d.toTimeString().slice(0,8);
const ago=d=>{const s=(Date.now()-d)/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return 'yesterday'};
const ms=v=>v<10?v.toFixed(1)+' ms':Math.round(v)+' ms';
const fmt=n=>Number(n).toLocaleString('en-US');
const subj=s=>s==='*'?'Any agent':s;
const act=a=>a==='*'?'any action':a;
const ruleLabel=r=>`${subj(r.subject)} → ${r.service}.${r.action==='*'?'*':r.action}`;
const condText=c=>`${c.param} ${OPS[c.op]||c.op} ${c.value}`;
const renderCall=(svc,action,params)=>`${svc}.${action}(${Object.entries(params||{}).map(([k,v])=>`${k}=${typeof v==='number'?v:JSON.stringify(v)}`).join(', ')})`;

/* ===================== services ===================== */
const SERVICES0=[
 {id:'documents',name:'Document store',kind:'MCP server',endpoint:'mcp://documents.internal',owner:'platform-team',verified:new Date(Date.now()-2*3600e3),actions:[

 {id:'filesystem',name:'File system',kind:'MCP server',endpoint:'mcp://fs.internal',owner:'platform-team',verified:new Date(Date.now()-50*60e3),actions:[

/* ===================== policy ===================== */
function mk(id,type,extra={}){return Object.assign({id,type,name:NODE_TYPES[type].label},clone(NODE_TYPES[type].defaults),extra)}
const P14={version:14,default_reaction:'block',
 checks:[
  mk('secrets','secrets_detection'),
  mk('pii','pii_detection'),
  mk('models','allowed_models'),
  mk('paths','denied_paths'),
  mk('access','service_access'),

  mk('tokens','token_budget'),
  mk('injection','semantic',{name:'Prompt injection classifier',classifier:'injection',applies_to:'input',instruction_version:3,

  mk('leak','semantic',{name:'Sensitive output classifier',classifier:'sensitive_output',applies_to:'output',instruction_version:2,

 ],
 rules:[
  {id:'r1',subject:'support-bot',service:'documents',action:'read',reaction:'allow',note:'Support reads knowledge base articles'},
  {id:'r2',subject:'support-bot',service:'documents',action:'search',reaction:'allow'},
  {id:'r3',subject:'support-bot',service:'crm',action:'get_customer',reaction:'allow'},
  {id:'r4',subject:'finance-copilot',service:'payments',action:'create_refund',conditions:[{param:'amount',op:'lte',value:'500'}],reaction:'allow',note:'Refunds up to 500 without human approval'},
  {id:'r5',subject:'finance-copilot',service:'payments',action:'get_balance',reaction:'allow'},
  {id:'r6',subject:'*',service:'web',action:'search',reaction:'allow'},
  {id:'r7',subject:'research-agent',service:'models',action:'load_model',reaction:'allow'},

  {id:'r9',subject:'finance-copilot',service:'filesystem',action:'read_file',reaction:'allow',note:'Reads exported reports'},
  {id:'r10',subject:'*',service:'crm',action:'export_customers',reaction:'block',note:'Bulk export only through the data team'}

const PII_ORDER=['iban','card','pesel','email','phone'];
const SIGS=[[/\.pkl\b|\bpickle\.loads?\b/i,'SIG-2024-PICKLE-RCE'],[/torch\.load/i,'SIG-2024-PICKLE-RCE'],[/__reduce__|os\.system\(|subprocess\.Popen/i,'SIG-2023-RCE-PAYLOAD'],[/-(?:uncensored|backdoor)\b/i,'SIG-2025-POISONED-REPO']];
function findSpans(text,list){const out=[];list.forEach(([re,label])=>{for(const m of text.matchAll(new RegExp(re.source,re.flags.includes('g')?re.flags:re.flags+'g')))out.push({s:m[0],label})});return out}

function toRegex(p){const ci=p.startsWith('(?i)');return new RegExp(ci?p.slice(4):p,ci?'gi':'g')}

/* simulated local classifier: deterministic labels, variable latency */
const SIM={};
function classify(n,text){
  const mode=SIM[n.id]||'none';const cache=Math.random()<.85?'hit':'miss';
  const lat=cache==='hit'?rnd(60,110):rnd(180,260);const tokens_in=420+Math.round(text.length/4);
  if(mode==='timeout')return {timeout:true,lat:n.timeout_ms||800,cache,tokens_in,tokens_out:0};
  if(mode==='unknown')return {label:'inj',lat,cache,tokens_in,tokens_out:1};
  let label,ev=null,m;
  if(n.classifier==='injection'){
    if((m=text.match(/developer mode|jailbreak|\bDAN\b/i))){label='jailbreak';ev=m[0]}
    else if((m=text.match(/ignore (?:all )?(?:previous|prior) instructions|system prompt|<!--\s*assistant:[^>]*-->|prompt injection/i))){label='injection';ev=m[0]}
    else label='benign';
  } else if(n.classifier==='sensitive_output'){
    if((m=text.match(/confidential|reorganisation|layoffs?|salar(?:y|ies)/i))){label='confidential';ev=m[0]}
    else if((m=text.match(/\binternal\b/i))){label='internal';ev=m[0]}
    else label='public';
  } else {
    const labels=(n.labels||[]).map(l=>l.label);label=labels[0]||'safe';
    for(const l of labels.slice(1)){if(l&&text.toLowerCase().includes(l.toLowerCase())){label=l;ev=l;break}}
  }
  return {label,ev,lat,cache,tokens_in,tokens_out:1};
}

/* ===================== evaluation engine ===================== */
function ruleMatches(r,req){
  if(r.service!==req.service)return false;
  if(r.subject!=='*'&&r.subject!==req.agent)return false;
  if(r.action!=='*'&&r.action!==req.action)return false;
  return (r.conditions||[]).every(c=>{const v=req.params?req.params[c.param]:undefined;if(v===undefined)return false;const s=String(v),x=String(c.value);
    switch(c.op){case 'eq':return s===x;case 'neq':return s!==x;case 'contains':return s.includes(x);case 'not_contains':return !s.includes(x);case 'starts_with':return s.startsWith(x);case 'lte':return Number(v)<=Number(x);case 'gte':return Number(v)>=Number(x);default:return false}});
}
function matchRules(policy,req){
  const cands=(policy.rules||[]).filter(r=>ruleMatches(r,req));
  if(!cands.length)return {reaction:policy.default_reaction,rule:null,detail:`No rule matched ${req.agent} → ${req.service}.${req.action}. Default: ${MODE_LABEL[policy.default_reaction]}`};
  const score=r=>(r.subject!=='*'?2:0)+(r.action!=='*'?1:0);const top=Math.max(...cands.map(score));
  const best=cands.filter(r=>score(r)===top);const win=best.find(r=>r.reaction==='block')||best[0];
  return {reaction:win.reaction,rule:win,detail:`Rule ${win.id}: ${ruleLabel(win)}${(win.conditions||[]).length?' if '+win.conditions.map(condText).join(' and '):''}. ${MODE_LABEL[win.reaction]}${best.length>1?` (won a tie against ${best.length-1} other rule${best.length>2?'s':''})`:''}`};
}
function evaluate(policy,req){
  let text=req.text;const checks=[];let decision='allow',trigger=null,stopped=false,throttle=0;const marks=[];
  for(const n of policy.checks){
    const def=NODE_TYPES[n.type];if(!def)continue;const kind=def.kind;const base={id:n.id,name:n.name,kind,type:n.type};
    if(stopped){checks.push({...base,result:'skipped',lat:0});continue}
    if(n.mode==='off'){checks.push({...base,result:'off',lat:0});continue}
    let reaction=null,detail='',lat=kind==='signature'?rnd(.6,2.2):kind==='rule'?rnd(.2,1.3):rnd(.05,.4),extra={},na=false,spans=null;
    switch(n.type){
      case 'secrets_detection':{spans=findSpans(text,SECRETS);if(spans.length){reaction=n.mode;detail='Found '+[...new Set(spans.map(s=>s.label))].join(', ')}else detail='No secrets found';break}
      case 'pii_detection':{const list=PII_ORDER.filter(k=>(n.entities||[]).includes(k)).map(k=>PII[k]);spans=[];let t=text;list.forEach(p=>{const f=findSpans(t,[p]);f.forEach(sp=>{spans.push(sp);t=t.split(sp.s).join('['+sp.label+']')})});
        if(spans.length){reaction=n.mode;detail='Found '+[...new Set(spans.map(s=>s.label))].join(', ')}else detail='No personal data found';break}
      case 'regex_pattern':{spans=[];(n.patterns||[]).forEach(p=>{try{for(const m of text.matchAll(toRegex(p)))spans.push({s:m[0],label:'PATTERN'})}catch(e){}});
        if(spans.length){reaction=n.mode;detail=`Pattern matched “${spans[0].s}”`}else detail='No pattern matched';break}
      case 'allowed_models':{if(req.dir==='tool_call'){na=true;break}if(!(n.models||[]).includes(req.target)){reaction=n.mode;detail=`${req.target} is not on the allowed list`;marks.push(req.target)}else detail=`${req.target} is allowed`;break}
      case 'denied_paths':{if(req.dir!=='tool_call'){na=true;break}const vals=Object.values(req.params||{}).map(String);const p=(n.deny_paths||[]).find(p=>p&&vals.some(v=>v.includes(p)));
        if(p){reaction=n.mode;detail=`An argument contains the denied path ${p}`;const v=vals.find(v=>v.includes(p));marks.push(v)}else detail='No denied paths in arguments';break}
      case 'service_access':{if(req.dir!=='tool_call'){na=true;break}const m=matchRules(policy,req);detail=m.detail;extra.rule=m.rule?m.rule.id:null;
        if(m.reaction!=='allow')reaction=n.mode==='monitor'?'monitor':m.reaction;break}
      case 'signature_feed':{const hit=SIGS.map(([re,sig])=>{const m=text.match(re);return m?{m:m[0],sig}:null}).find(Boolean);

      case 'rate_limit':{const r=(req.meta&&req.meta.rpm)||0;if(r>n.max_per_minute){reaction=n.mode;detail=`${r} requests in the last minute, limit ${n.max_per_minute}`}else detail='Within the rate limit';break}
      case 'loop_detector':{const r=(req.meta&&req.meta.similar)||0;if(r>n.max_similar_per_minute){reaction=n.mode;detail=`${r} similar calls in one minute, limit ${n.max_similar_per_minute}`}else detail='No loop detected';break}
      case 'token_budget':{if(req.meta&&req.meta.tokens_over){reaction=n.mode;detail=`Daily budget of ${fmt(n.daily_tokens)} tokens is used up`}else detail='Within the daily budget';break}
      case 'semantic':{
        const applies=(n.applies_to==='output'&&req.dir==='output')||(n.applies_to==='input'&&req.dir==='input');if(!applies){na=true;break}
        const c=classify(n,text);lat=c.lat;extra={label:c.timeout?null:c.label,cache:c.cache,tokens_in:c.tokens_in,tokens_out:c.tokens_out,model:n.model,instruction_version:n.instruction_version,input:text,timeout:!!c.timeout};
        if(c.timeout){reaction=n.on_timeout;detail=`No answer within ${n.timeout_ms} ms. Reaction on timeout: ${MODE_LABEL[n.on_timeout]}`}
        else{const L=(n.labels||[]).find(l=>l.label===c.label);
          if(!L){reaction=n.on_unknown;detail=`Unknown label “${c.label}”. Reaction on unknown label: ${MODE_LABEL[n.on_unknown]}`}
          else{reaction=L.reaction;detail=`Label “${c.label}”, 1 token, prefix cache ${c.cache}`}
          if(c.ev)marks.push(c.ev)}
        if(reaction==='allow')reaction=null;
        if(reaction&&n.mode==='monitor')reaction='monitor';
        break}
    }
    if(na){checks.push({...base,result:'na',lat:0,detail:'Not applicable to this request'});continue}
    let result='pass';
    if(reaction){
      const ex=(n.exceptions||[]).find(e=>(!e.agent||e.agent===req.agent)&&e.match&&req.text.toLowerCase().includes(e.match.toLowerCase()));
      if(ex){result='exception';detail+=`. Passed by exception “${ex.match}”`}
      else{
        result=reaction;
        if(RANK[reaction]>RANK[decision]){decision=reaction;trigger=n.id}
        if(spans)spans.forEach(s=>marks.push(s.s));
        if(reaction==='redact'){text=spans&&spans.length?redactText(text,spans):`[REDACTED: ${extra.label||'content'}]`}
        if(reaction==='throttle')throttle+=n.delay_ms||1500;
        if(reaction==='block')stopped=true;
      }
    }
    checks.push({...base,result,lat,detail,...extra});
  }
  const overhead=checks.reduce((s,c)=>s+c.lat,0);
  const tn=trigger?policy.checks.find(n=>n.id===trigger):null;
  const tc=checks.find(c=>c.id===trigger);
  return {decision,trigger,triggerName:tn?tn.name:null,triggerType:tn?tn.type:null,triggerDetail:tc?tc.detail:null,triggerRule:tc?tc.rule:null,checks,overhead,throttle,processed:decision==='block'?null:text,marks,version:policy.version};
}

  A.forEach(n=>{const m=b[n.id];if(!m)return;const keys=new Set([...Object.keys(n),...Object.keys(m)]);keys.delete('id');
    keys.forEach(k=>{if(JSON.stringify(n[k])!==JSON.stringify(m[k]))ops.push({op:'change',sec,id:n.id,label:label(m),field:k,from:clone(n[k]),to:clone(m[k])})})});
  const ca=A.map(n=>n.id).filter(id=>b[id]),cb=B.map(n=>n.id).filter(id=>a[id]);
  if(ca.join()!==cb.join())ops.push({op:'order',sec,from:ca,to:cb});

}
function diff(a,b){

}
function describe(o){

  if(o.op==='remove')return `Removed ${pre}${o.label}`;
  if(o.op==='order')return o.sec==='rule'?'Changed the order of rules':'Changed the order of checks';
  if(o.field==='exceptions'){const f=o.from||[],t=o.to||[];if(t.length>f.length){const e=t[t.length-1];return `${o.label}: exception added (${e.agent||'any agent'}, “${e.match}”)`}return `${o.label}: exception removed`}
  const name=o.sec==='rule'?'Rule '+o.label:o.label;

}

  const ops=diff(oldLive,draft);const r=clone(newLive);

    if(o.sec==='policy'){r.default_reaction=o.to;return}
    const list=o.sec==='rule'?r.rules:r.checks;
    if(o.op==='add'&&!list.find(n=>n.id===o.id))list.splice(Math.min(o.index,list.length),0,clone(o.item));
    if(o.op==='remove'){const i=list.findIndex(n=>n.id===o.id);if(i>=0)list.splice(i,1)}
    if(o.op==='change'){const n=list.find(n=>n.id===o.id);if(n){if(o.to===undefined)delete n[o.field];else n[o.field]=clone(o.to)}}
  });
  const sortBy=(list,src)=>{const order=src.map(n=>n.id);list.sort((x,y)=>{const a=order.indexOf(x.id),b=order.indexOf(y.id);return (a<0?999:a)-(b<0?999:b)})};

function lineDiff(a,b){
  const A=a.split('\n'),B=b.split('\n'),m=A.length,n=B.length;const L=Array.from({length:m+1},()=>new Int16Array(n+1));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);

  while(i<m)out.push(['d',A[i++]]);while(j<n)out.push(['a',B[j++]]);return out;
}

/* ===================== YAML ===================== */
function toYamlObj(p){
  return {version:p.version,default_reaction:p.default_reaction,
    checks:p.checks.map(n=>{const o={id:n.id,type:n.type,name:n.name,mode:n.mode};CHECK_KEYS.forEach(k=>{if(n[k]!==undefined&&!(Array.isArray(n[k])&&!n[k].length))o[k]=n[k]});return o}),
    rules:p.rules.map(r=>{const o={id:r.id,subject:r.subject,service:r.service,action:r.action};if((r.conditions||[]).length)o.conditions=r.conditions;o.reaction=r.reaction;if(r.note)o.note=r.note;return o})};
}
function dump(p){return jsyaml.dump(toYamlObj(p),{lineWidth:-1,noRefs:true})}
function fromYaml(text){
  const o=jsyaml.load(text);
  if(!o||typeof o!=='object')throw new Error('The file is empty or not a mapping.');
  if(!Array.isArray(o.checks))throw new Error('“checks” must be a list.');
  const ids=new Set();
  const checks=o.checks.map((n,i)=>{
    if(!n||typeof n!=='object')throw new Error(`Check ${i+1} is not a mapping.`);
    if(!n.id)throw new Error(`Check ${i+1} has no id.`);
    if(ids.has(n.id))throw new Error(`Id “${n.id}” is used twice.`);ids.add(n.id);
    const def=NODE_TYPES[n.type];if(!def)throw new Error(`Check “${n.id}” has unknown type “${n.type}”.`);
    if(n.mode&&!def.modes.includes(n.mode))throw new Error(`Check “${n.id}”: mode “${n.mode}” is not allowed. Use ${def.modes.join(', ')}.`);
    return Object.assign({id:String(n.id),type:n.type,name:n.name||def.label},clone(def.defaults),n);
  });
  const rules=(o.rules||[]).map((r,i)=>{
    if(!r||typeof r!=='object'||!r.id)throw new Error(`Rule ${i+1} has no id.`);
    if(ids.has(r.id))throw new Error(`Id “${r.id}” is used twice.`);ids.add(r.id);
    if(!['allow','block'].includes(r.reaction))throw new Error(`Rule “${r.id}”: reaction must be allow or block.`);
    return {id:String(r.id),subject:String(r.subject||'*'),service:String(r.service||''),action:String(r.action||'*'),...(r.conditions?{conditions:r.conditions.map(c=>({param:String(c.param),op:String(c.op),value:String(c.value)}))}:{}),reaction:r.reaction,...(r.note?{note:String(r.note)}:{})};
  });
  const dr=o.default_reaction==='allow'?'allow':'block';
  return {version:S.live.version,default_reaction:dr,checks,rules};
}
function validate(p){
  const errs={},warns={};const add=(m,id,x)=>(m[id]=m[id]||[]).push(x);
  p.checks.forEach((n,i)=>{
    if(!String(n.name||'').trim())add(errs,n.id,'Name is empty.');
    if(n.type==='regex_pattern'){if(!(n.patterns||[]).length)add(errs,n.id,'Add at least one pattern.');(n.patterns||[]).forEach(x=>{try{toRegex(x)}catch(e){add(errs,n.id,`Pattern “${x}” is not a valid regular expression.`)}})}
    if(n.type==='allowed_models'&&!(n.models||[]).length)add(errs,n.id,'List at least one model, or every prompt will be blocked.');
    ['max_per_minute','delay_ms','daily_tokens','max_similar_per_minute','refresh_minutes','timeout_ms'].forEach(k=>{if(n[k]!==undefined&&!(n[k]>0))add(errs,n.id,`${k.replace(/_/g,' ')} must be a positive number.`)});
    (n.exceptions||[]).forEach(e=>{if(!String(e.match||'').trim())add(errs,n.id,'An exception has no text to match.')});
    if(n.type==='semantic'){
      if(!String(n.instruction||'').trim())add(errs,n.id,'The instruction is empty.');
      const ls=(n.labels||[]).map(l=>String(l.label||'').trim());
      if(ls.length<2)add(errs,n.id,'Add at least two labels.');
      if(ls.some(l=>!l))add(errs,n.id,'A label is empty.');
      if(new Set(ls).size!==ls.length)add(errs,n.id,'Labels must be unique.');
      if(ls.some(l=>/\s/.test(l)))add(errs,n.id,'Labels must be single words so the model can answer with one token.');
      const firstDet=p.checks.findIndex(x=>NODE_TYPES[x.type]&&NODE_TYPES[x.type].kind==='rule'&&x.mode!=='off');
      const lastDet=p.checks.map(x=>NODE_TYPES[x.type]&&NODE_TYPES[x.type].kind==='rule'&&x.mode!=='off').lastIndexOf(true);
      if(firstDet>=0&&i<lastDet)add(warns,n.id,'Runs before a deterministic check, so the model may see data that is not cleaned yet.');
    }
  });
  if(p.checks.filter(n=>n.type==='service_access').length>1)p.checks.filter(n=>n.type==='service_access').forEach(n=>add(errs,n.id,'Only one service access stage is allowed.'));
  p.rules.forEach(r=>{
    const svc=S.services.find(s=>s.id===r.service);
    if(!svc){add(errs,r.id,`Service “${r.service}” is not in the catalog.`);return}
    const a=r.action==='*'?null:svc.actions.find(x=>x.name===r.action);
    if(r.action!=='*'&&!a)add(errs,r.id,`Action “${r.action}” does not exist in ${svc.name}.`);
    (r.conditions||[]).forEach(c=>{
      const params=a?a.params:svc.actions.flatMap(x=>x.params);
      if(!params.find(p=>p.name===c.param))add(errs,r.id,`Parameter “${c.param}” does not exist for this action.`);
      if(String(c.value??'').trim()==='')add(errs,r.id,'A condition has no value.');
      if(['lte','gte'].includes(c.op)&&isNaN(Number(c.value)))add(errs,r.id,`“${c.value}” is not a number.`);
    });
  });
  return {errs,warns};
}

function commit(policy,{author='You',source='Console',summary}={}){
  const p=clone(policy);
  p.checks.forEach(n=>{if(n.type!=='semantic')return;const old=S.live.checks.find(x=>x.id===n.id);if(old&&old.instruction!==n.instruction)n.instruction_version=(old.instruction_version||1)+1});
  const ops=diff(S.live,p);const v=S.live.version+1;p.version=v;
  S.live=p;S.history.push({v,policy:clone(p),author,source,at:new Date(),ops,summary:summary||summarize(ops)});
  updateChip();return v;
}

  const verb={block:'Blocked',redact:'Redacted',throttle:'Throttled',monitor:'Flagged'}[r.decision];
  let s=`${verb} by ${r.triggerName}. ${r.triggerDetail||''}`.trim();
  if(r.decision==='throttle')s+=`. Delayed by ${(r.throttle/1000).toFixed(1)} s`;

        <dt>Policy</dt><dd>v${r.version}${r.version!==S.live.version?` <span class="tag warn">now v${S.live.version}</span>`:''}</dd><dt>Tokens</dt><dd>${r.decision==='block'?'0, not sent':fmt(e.tokens)}</dd><dt>Request ID</dt><dd>${e.id}</dd></dl></div>
      <div class="box"><h3>Actions</h3><div class="actions">
        ${r.decision!=='allow'?`<button class="btn" id="aFp">${e.fp?'Edit false positive note':'Mark as false positive'}</button>`:''}
        ${accessBlock?(r.triggerRule?`<button class="btn" id="aRule">Open rule ${esc(r.triggerRule)}</button>`:`<button class="btn" id="aNewRule">Create a rule for ${esc(req.service)}.${esc(req.action)}</button>`):''}
        ${r.trigger&&!accessBlock?`<button class="btn" id="aEx">Add exception to ${esc(r.triggerName)}</button>`:''}
        <button class="btn" id="aTest">Save as test case</button>
        <button class="btn primary" id="aReplay">Replay with current policy</button>
        ${r.trigger&&!accessBlock?`<button class="btn" id="aOpen">Open ${esc(r.triggerName)} in builder</button>`:''}
      </div><div id="replayOut"></div></div>
    </aside>
  </div>`;
  const b=x=>document.getElementById(x);
  if(b('aFp'))b('aFp').onclick=()=>markFP(e);
  if(b('aEx'))b('aEx').onclick=()=>addException(e);
  if(b('aRule'))b('aRule').onclick=()=>{location.hash='#/builder/rules/'+r.triggerRule};
  if(b('aNewRule'))b('aNewRule').onclick=()=>newRuleFor(req);
  b('aTest').onclick=()=>saveAsTest(e);
  b('aReplay').onclick=()=>replay(e);
  if(b('aOpen'))b('aOpen').onclick=()=>{location.hash='#/builder/checks/'+r.trigger};
  if(S.replay[e.id])drawReplay(e);
}
function replay(e){const res={current:evaluate(S.live,e.req)};if(isDirty())res.draft=evaluate(S.draft,e.req);S.replay[e.id]=res;drawReplay(e)}
function drawReplay(e){
  const res=S.replay[e.id];if(!res)return;const o=e.r;
  const col=(lbl,r)=>`<div class="col"><small>${lbl}</small>${stPill(r.decision)}</div>`;
  let html=`<div class="replay" style="margin-top:16px">${col('Original, v'+o.version,o)}<span class="arrow">→</span>${col('Current, v'+res.current.version,res.current)}</div>`;
  if(res.draft)html+=`<div class="replay">${col('Original, v'+o.version,o)}<span class="arrow">→</span>${col('Unsaved draft',res.draft)}</div>`;
  const changed=res.current.decision!==o.decision;
  html+=`<p class="replay-note">${changed?`With policy v${res.current.version}: ${esc(reasonText(e.req,res.current))}`:`Same result with policy v${res.current.version}.`}</p>`;
  const out=document.getElementById('replayOut');if(out)out.innerHTML=html;
}
function markFP(e){

    <div class="field"><label for="fpC">Comment</label><textarea id="fpC" style="font-family:var(--sans);font-size:14px">${esc(e.fp?e.fp.comment:'Legitimate security training question from the platform team.')}</textarea></div>`,
    actions:[{label:'Cancel'},{label:'Mark as false positive',kind:'primary',run:root=>{e.fp={comment:root.querySelector('#fpC').value.trim(),by:'You',at:new Date()};

}
function eventToTest(e,expected){
  const q=e.req;const base={id:'t'+(tid++),name:'',agent:q.agent,dir:q.dir,expected};
  if(q.dir==='tool_call')Object.assign(base,{service:q.service,action:q.action,params:clone(q.params)});else Object.assign(base,{target:q.target,text:q.text});
  if(q.meta&&Object.keys(q.meta).length)base.meta=clone(q.meta);return base;
}
function saveAsTest(e){

    <div class="field"><label for="tN">Name</label><input type="text" id="tN" value="${esc((e.fp?'Should pass: ':'')+(e.req.dir==='tool_call'?`${e.req.agent} calls ${e.req.service}.${e.req.action}`:e.req.text.slice(0,48)))}"></div>
    <div class="field"><span class="lbl">Expected result</span><div class="seg" id="tE">${['allow','redact','block','throttle'].map(x=>`<button data-x="${x}" aria-pressed="${x===def}">${MODE_LABEL[x]}</button>`).join('')}</div></div>`,
    actions:[{label:'Cancel'},{label:'Save test case',kind:'primary',run:root=>{const x=root.querySelector('#tE [aria-pressed="true"]').dataset.x;const t=eventToTest(e,x);t.name=root.querySelector('#tN').value.trim()||'Untitled test';if(x==='redact'&&e.r.processed)t.expected_output=e.r.processed;S.tests.push(t);toast(`Test case added. ${S.tests.length} tests in the suite.`)}}]});
  document.querySelectorAll('#tE button').forEach(b=>b.onclick=()=>document.querySelectorAll('#tE button').forEach(x=>x.setAttribute('aria-pressed',x===b)));
}
function addException(e){
  const t=TK[e.key];const node=S.live.checks.find(n=>n.id===e.r.trigger);if(!node)return;
  const suggestion=t.suggest||e.req.text.split(/\s+/).slice(0,4).join(' ');
  modal({title:'Add exception',body:`<p>Requests that match this exception pass <b>${esc(node.name)}</b>. All other checks still run.</p>
    <div class="field"><label for="exA">Agent</label><select id="exA"><option value="">Any agent</option>${AGENTS.map(a=>`<option ${a===e.req.agent?'selected':''}>${a}</option>`).join('')}</select></div>
    <div class="field"><label for="exM">Text the request contains</label><input type="text" id="exM" value="${esc(suggestion)}"><div class="hint">Case-insensitive. Keep it specific so it cannot be reused to bypass the check.</div></div>
    <div class="field"><label class="chk" style="display:inline-flex"><input type="checkbox" id="exT" checked> Also save this request as a test case expecting Allow</label></div>
    <div class="preview" id="exP"></div>`,
    actions:[{label:'Cancel'},{label:'Check impact and apply',kind:'primary',run:root=>{
      const ex={match:root.querySelector('#exM').value.trim()};const ag=root.querySelector('#exA').value;if(ag)ex.agent=ag;
      if(!ex.match){root.querySelector('#exM').focus();return false}
      if(root.querySelector('#exT').checked){const tc=eventToTest(e,'allow');tc.name='Should pass: '+(e.req.text.slice(0,48));S.tests.push(tc)}
      const p=clone(S.live);const n=p.checks.find(n=>n.id===node.id);n.exceptions=[...(n.exceptions||[]),ex];
      setTimeout(()=>checkImpact(p,{source:'Console, from request '+e.id,after:()=>{renderDetail(e.id);replay(e)}}),30);
    }}]});
  const upd=()=>{const a=$('#exA').value,m=$('#exM').value.trim();$('#exP').textContent=m?`Requests from ${a||'any agent'} containing “${m}” will skip ${node.name}.`:'Enter the text to match.'};
  $('#exA').onchange=upd;$('#exM').oninput=upd;upd();
}
function newRuleFor(req){
  let i=1;while(S.draft.rules.find(r=>r.id==='r'+i))i++;
  S.draft.rules.push({id:'r'+i,subject:req.agent,service:req.service,action:req.action,reaction:'allow',note:''});

}

  $('#sim').onclick=simulateFileEdit;

}
function renderBuilderKeepScroll(){const sy=window.scrollY;renderBuilder();window.scrollTo(0,sy)}
function yamlPane(){return `<div class="yamlpane"><div class="yaml-head"><span>policy.yaml, edits apply to the draft</span></div>
  <div class="yaml-wrap"><pre id="yHl" aria-hidden="true"></pre><textarea id="yText" spellcheck="false" wrap="off" aria-label="Policy YAML"></textarea></div><div id="yMsg"></div></div>`}
function refreshMeta(){
  const dirty=isDirty();const n=diff(S.live,S.draft).length;const dm=$('#dirtyMeta');
  if(dm)dm.innerHTML=dirty?`<span class="dirty">${n} unsaved change${n>1?'s':''}</span>`:'No unsaved changes';
  if($('#save'))$('#save').disabled=!dirty;if($('#discard'))$('#discard').disabled=!dirty;
  const tabs=document.querySelectorAll('.subtabs a span');if(tabs.length===3){tabs[0].textContent=S.draft.checks.length;tabs[1].textContent=S.draft.rules.length;tabs[2].textContent=S.tests.length}
}
function afterDraftChange(full){
  if(full){renderBuilderKeepScroll();return}

}
function changedTag(id,list){const live=(list==='rule'?S.live.rules:S.live.checks).find(x=>x.id===id);const cur=(list==='rule'?S.draft.rules:S.draft.checks).find(x=>x.id===id);
  if(!live)return '<span class="tag new">New</span>';return JSON.stringify(live)!==JSON.stringify(cur)?'<span class="tag warn">Unsaved</span>':''}

/* ---------- checks tab ---------- */
function renderChecksTab(){
  const groups={};Object.entries(NODE_TYPES).forEach(([k,d])=>{if(k==='service_access')return;(groups[d.group]=groups[d.group]||[]).push([k,d])});
  $('#bwrap').innerHTML=`<div class="builder ${S.yaml?'yaml':''}">
    ${S.yaml?'':`<div class="lib" aria-label="Check library">${Object.entries(groups).map(([g,list])=>`<h3>${g}</h3>${list.map(([k,d])=>`<button data-add="${k}" title="Add ${d.label} after the selected check">${gly(d.kind)}${d.label}<span aria-hidden="true">+</span></button>`).join('')}`).join('')}</div>`}
    <div class="pipe" id="pipe"></div><div id="settings"></div>${S.yaml?yamlPane():''}</div>`;
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=S.draft.checks.findIndex(n=>n.id===S.sel);addCheck(b.dataset.add,i>=0?i+1:S.draft.checks.length)});
  if(!S.draft.checks.find(n=>n.id===S.sel))S.sel=S.draft.checks[0]&&S.draft.checks[0].id;
  drawPipe();drawSettings();if(S.yaml)initYaml();
}
function openPicker(index){
  const groups={};Object.entries(NODE_TYPES).forEach(([k,d])=>{if(k==='service_access'&&S.draft.checks.some(n=>n.type==='service_access'))return;(groups[d.group]=groups[d.group]||[]).push([k,d])});
  const root=modal({title:'Add a check',body:`<p>The check is added at this point in the pipeline. Deterministic checks should run before AI checks.</p><div class="picker">${Object.entries(groups).map(([g,list])=>`<h3>${g}</h3>${list.map(([k,d])=>`<button data-pick="${k}">${gly(d.kind)}<b>${d.label}</b><small>${d.desc}</small></button>`).join('')}`).join('')}</div>`,actions:[{label:'Cancel'}]});
  root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{root.innerHTML='';addCheck(b.dataset.pick,index)});
}
function addCheck(type,index){
  const base=type==='semantic'?'classifier':type.split('_')[0];let i=1,id=base;while(S.draft.checks.find(n=>n.id===id)||S.draft.rules.find(r=>r.id===id))id=base+'_'+(++i);
  const node=mk(id,type);if(type==='semantic')node.name='Custom AI classification';
  S.draft.checks.splice(Math.max(0,Math.min(index,S.draft.checks.length)),0,node);S.sel=id;afterDraftChange(true);toast(`${node.name} added to the draft`);
}
function keySetting(n){
  switch(n.type){
    case 'semantic':return `${n.applies_to==='output'?'Answers':'Prompts'}, ${n.model}, labels: ${(n.labels||[]).map(l=>l.label+' → '+l.reaction).join(', ')}`;
    case 'pii_detection':return (n.entities||[]).map(x=>x.toUpperCase()).join(', ')||'No data types';
    case 'regex_pattern':return `${(n.patterns||[]).length} pattern${(n.patterns||[]).length===1?'':'s'}`;
    case 'allowed_models':return (n.models||[]).join(', ')||'No models';
    case 'denied_paths':return `${(n.deny_paths||[]).length} denied paths`;
    case 'service_access':return `${S.draft.rules.length} rules, calls without a rule: ${MODE_LABEL[S.draft.default_reaction]}`;
    case 'signature_feed':return `Feed refreshed every ${n.refresh_minutes} min`;
    case 'rate_limit':return `${n.max_per_minute} per minute, ${(n.delay_ms/1000).toFixed(1)} s delay`;
    case 'token_budget':return `${fmt(n.daily_tokens)} tokens per agent per day`;
    case 'loop_detector':return `${n.max_similar_per_minute} similar calls per minute`;
    default:return NODE_TYPES[n.type].desc;
  }
}
function drawPipe(){
  const {errs,warns}=validate(S.draft);const N=S.draft.checks.length;

  $('#pipe').innerHTML=`<div class="endpoint">Agent request</div>`+S.draft.checks.map((n,i)=>{
    const d=NODE_TYPES[n.type];const ext=S.ext&&S.ext.changes[n.id];const ex=(n.exceptions||[]).length;const stage=n.type==='service_access';
    return ins(i)+`<div class="ncard ${n.id===S.sel?'sel':''} ${n.mode==='off'?'off':''} ${stage?'stage':''}" data-id="${n.id}" draggable="true" tabindex="0" aria-label="${esc(n.name)}, ${MODE_LABEL[n.mode]}">
      ${gly(d.kind)}<div class="nm">${esc(n.name)} ${changedTag(n.id,'check')}${ex?`<span class="tag">${ex} exception${ex>1?'s':''}</span>`:''}${errs[n.id]?'<span class="tag err">Needs fixing</span>':''}${warns[n.id]?'<span class="tag warn">Check order</span>':''}</div>
      <div class="mode"><span class="mpill ${n.mode==='enforce'?'block':n.mode}">${MODE_LABEL[n.mode]}</span><span class="hits">${HITS[n.id]!=null?HITS[n.id]+' hits in 24 h':'No traffic yet'}</span></div>
      <div class="sub">${KIND_LABEL[d.kind]}. ${esc(keySetting(n))}${stage?` <button class="link" data-goto-rules>Edit rules</button>`:''}</div>

      ${errs[n.id]?`<div class="errs">${errs[n.id].map(esc).join('<br>')}</div>`:''}

    </div>`}).join('')+ins(N)+`<button class="btn small add-end" data-ins="${N}">Add check</button><div class="wire"></div><div class="endpoint">Model or service</div>`;
  const pipe=$('#pipe');let dragId=null;
  pipe.querySelectorAll('[data-ins]').forEach(b=>b.onclick=e=>{e.stopPropagation();openPicker(+b.dataset.ins)});
  pipe.querySelectorAll('[data-goto-rules]').forEach(b=>b.onclick=e=>{e.stopPropagation();location.hash='#/builder/rules'});
  pipe.querySelectorAll('.ncard').forEach(c=>{
    c.onclick=e=>{const tb=e.target.closest('[data-t]');const id=c.dataset.id;if(tb){tool(id,tb.dataset.t);return}if(S.sel!==id){S.sel=id;drawPipe();drawSettings();if(S.yaml)highlightYaml()}};
    c.onkeydown=e=>{if(e.key==='Enter'&&e.target===c){S.sel=c.dataset.id;drawPipe();drawSettings();if(S.yaml)highlightYaml()}};
    c.ondragstart=e=>{dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)};
    c.ondragover=e=>{e.preventDefault();c.classList.add('drag-over')};
    c.ondragleave=()=>c.classList.remove('drag-over');
    c.ondrop=e=>{e.preventDefault();c.classList.remove('drag-over');const from=S.draft.checks.findIndex(n=>n.id===dragId);if(from<0||dragId===c.dataset.id)return;const [m]=S.draft.checks.splice(from,1);const to=S.draft.checks.findIndex(n=>n.id===c.dataset.id);S.draft.checks.splice(to,0,m);afterDraftChange()};
  });
}
function tool(id,t){
  const ns=S.draft.checks;const i=ns.findIndex(n=>n.id===id);const n=ns[i];
  if(t==='up'&&i>0)[ns[i-1],ns[i]]=[ns[i],ns[i-1]];
  if(t==='down'&&i<ns.length-1)[ns[i+1],ns[i]]=[ns[i],ns[i+1]];
  if(t==='off'){n.mode=n.mode==='off'?NODE_TYPES[n.type].defaults.mode:'off'}
  if(t==='del'){modal({title:`Remove ${esc(n.name)}?`,body:`<p>The check is removed from the draft. Live traffic is not affected until you apply the change.</p>`,actions:[{label:'Cancel'},{label:'Remove check',kind:'danger',run:()=>{S.draft.checks.splice(i,1);if(S.sel===id)S.sel=null;afterDraftChange(true)}}]});return}
  S.sel=id;afterDraftChange();drawSettings();
}
const seg=(attr,opts,cur)=>`<div class="seg" role="group">${opts.map(m=>`<button data-${attr}="${m}" aria-pressed="${cur===m}">${MODE_LABEL[m]||m}</button>`).join('')}</div>`;
function listField(label,key,n,hint){return `<div class="field"><label for="f_${key}">${label}</label><textarea id="f_${key}" data-list="${key}">${esc((n[key]||[]).join('\n'))}</textarea>${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function numField(label,key,n,step=1){return `<div class="field"><label for="f_${key}">${label}</label><input type="number" id="f_${key}" data-num="${key}" value="${n[key]}" step="${step}" min="0"></div>`}
function exceptionsHtml(n){return `<hr class="divider"><div class="field"><span class="lbl">Exceptions</span>${(n.exceptions||[]).length?n.exceptions.map((e,i)=>`<div class="subrow"><select data-exc="${i}" data-k="agent" aria-label="Agent"><option value="">Any agent</option>${AGENTS.map(a=>`<option ${a===e.agent?'selected':''}>${a}</option>`).join('')}</select><input type="text" data-exc="${i}" data-k="match" value="${esc(e.match)}" aria-label="Text to match" placeholder="Text the request contains"><button class="x" data-delexc="${i}" aria-label="Remove exception">✕</button></div>`).join(''):'<p class="hint" style="margin:0 0 8px">No exceptions. Add one here or from a blocked request.</p>'}<button class="link" id="addExc">Add exception</button></div>`}
function drawSettings(){
  const box=$('#settings');const n=S.draft.checks.find(n=>n.id===S.sel);
  if(!n){box.innerHTML=`<div class="settings"><p class="muted">Select a check to edit it, or add one with the + buttons in the pipeline.</p></div>`;return}
  const d=NODE_TYPES[n.type];let body=`<div class="field"><label for="f_name">Name</label><input type="text" id="f_name" data-str="name" value="${esc(n.name)}"></div>`;
